name: Build, Test & Publish OMODs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B clean package -DskipTests -s .mvn/settings.xml

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: mvn -B test -s .mvn/settings.xml

      - name: Upload OMODs
        uses: actions/upload-artifact@v4
        with:
          name: omods
          path: '*/omod/target/*.omod'
          if-no-files-found: warn

      - name: Attach OMODs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for omod in */omod/target/*.omod; do
            if [ -f "$omod" ]; then
              echo "Uploading $(basename $omod)"
              gh release upload "${{ github.event.release.tag_name }}" "$omod" --clobber
            fi
          done
