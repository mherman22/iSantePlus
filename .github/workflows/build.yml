name: Build, Test & Publish OMODs

on:
  push:
    branches: [main,restructure/monorepo-modules]
  pull_request:
    branches: [main,restructure/monorepo-modules]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8.0.242'
          distribution: zulu
          cache: maven

      - name: Install vendored dependencies
        run: |
          mkdir -p ~/.m2/repository
          cp -r lib/maven-repo/* ~/.m2/repository/
          echo "Installed vendored JARs:"
          find ~/.m2/repository/org/marc/everest -name "*.jar" | head -10

      - name: Clear cached resolution failures
        run: find ~/.m2/repository -name "*.lastUpdated" -delete 2>/dev/null || true

      - name: Build all modules
        run: mvn -B -U clean package -DskipTests -s .mvn/settings.xml

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: mvn -B test -s .mvn/settings.xml -Dsurefire.shutdown=kill
        env:
          TZ: Europe/Paris

      - name: Upload OMODs
        uses: actions/upload-artifact@v4
        with:
          name: omods
          path: '*/omod/target/*.omod'
          if-no-files-found: warn

      - name: Attach OMODs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for omod in */omod/target/*.omod; do
            if [ -f "$omod" ]; then
              echo "Uploading $(basename $omod)"
              gh release upload "${{ github.event.release.tag_name }}" "$omod" --clobber
            fi
          done
