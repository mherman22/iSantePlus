name: Publish OMODs

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B clean package -DskipTests

      - name: Upload OMODs as release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for omod in modules/*/omod/target/*.omod; do
            if [ -f "$omod" ]; then
              echo "Uploading $omod"
              gh release upload "${{ github.event.release.tag_name }}" "$omod" --clobber
            fi
          done
