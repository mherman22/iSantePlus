name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Detect which modules changed to avoid unnecessary builds
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sedish: ${{ steps.filter.outputs.sedish }}
      core: ${{ steps.filter.outputs.core }}
      upstream: ${{ steps.filter.outputs.upstream }}
      bom: ${{ steps.filter.outputs.bom }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bom:
              - 'bom/**'
              - 'lib/**'
              - 'pom.xml'
            sedish:
              - 'mpi-client/**'
              - 'xds-sender/**'
              - 'registrationcore/**'
              - 'outgoing-exception/**'
              - 'labintegration/**'
              - 'bom/**'
              - 'lib/**'
            core:
              - 'isanteplus-openmrs_15Dec2025/**'
              - 'openmrs-isanteplusreports-module_13Janv2026/**'
              - 'registration/**'
              - 'bom/**'
            upstream:
              - 'openmrs-coreapps-module/**'
              - 'openmrs-htmlformentry-module/**'
              - 'openmrs-htmlformentryui-module/**'
              - 'openmrs-allergyui-module/**'
              - 'openmrs-referenceapp-module/**'
              - 'bom/**'
            any:
              - 'bom/**'
              - 'pom.xml'
              - 'mpi-client/**'
              - 'xds-sender/**'
              - 'registrationcore/**'
              - 'outgoing-exception/**'
              - 'labintegration/**'
              - 'isanteplus-openmrs_15Dec2025/**'
              - 'openmrs-isanteplusreports-module_13Janv2026/**'
              - 'registration/**'
              - 'openmrs-htmlformentry-module/**'

  # Build Sedish HIE modules (the most critical path)
  build-sedish:
    needs: detect-changes
    if: needs.detect-changes.outputs.sedish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build Sedish HIE modules
        run: >
          mvn -B clean install -DskipTests
          -pl bom,mpi-client,xds-sender,registrationcore,outgoing-exception,labintegration
          -am

      - name: Test Sedish HIE modules
        run: >
          mvn -B test
          -pl mpi-client,xds-sender,registrationcore,outgoing-exception,labintegration

      - name: Upload Sedish OMODs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sedish-omods
          path: |
            mpi-client/omod/target/*.omod
            xds-sender/omod/target/*.omod
            registrationcore/omod/target/*.omod
            outgoing-exception/omod/target/*.omod
            labintegration/omod/target/*.omod
          if-no-files-found: warn

  # Build iSantePlus core modules
  build-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build iSantePlus core modules
        run: >
          mvn -B clean install -DskipTests
          -pl bom,isanteplus-openmrs_15Dec2025,openmrs-isanteplusreports-module_13Janv2026,registration
          -am

      - name: Upload core OMODs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-omods
          path: |
            isanteplus-openmrs_15Dec2025/omod/target/*.omod
            openmrs-isanteplusreports-module_13Janv2026/omod/target/*.omod
            registration/omod/target/*.omod
          if-no-files-found: warn

  # Build upstream fork modules
  build-upstream:
    needs: detect-changes
    if: needs.detect-changes.outputs.upstream == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Build upstream fork modules
        run: >
          mvn -B clean install -DskipTests
          -pl bom,openmrs-htmlformentry-module,openmrs-allergyui-module,openmrs-htmlformentryui-module,openmrs-coreapps-module,openmrs-referenceapp-module
          -am

      - name: Upload upstream OMODs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-omods
          path: |
            openmrs-coreapps-module/omod/target/*.omod
            openmrs-htmlformentry-module/omod/target/*.omod
            openmrs-htmlformentryui-module/omod/target/*.omod
            openmrs-allergyui-module/omod/target/*.omod
            openmrs-referenceapp-module/omod/target/*.omod
          if-no-files-found: warn

  # Full reactor build on main (post-merge validation)
  build-all:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Full reactor build
        run: mvn -B clean package -DskipTests

      - name: Upload all OMODs
        uses: actions/upload-artifact@v4
        with:
          name: all-omods
          path: '*/omod/target/*.omod'
          if-no-files-found: warn
